name: Mirror public QVK catalogs
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qvk-public-catalog
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 qvk/mirror_catalog.py
      - name: Publish public snapshots
        run: |
          git config user.name 'QVK catalog mirror'
          git config user.email 'qvk-release@users.noreply.github.com'
          git add qvk/catalog
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh public QVK catalog mirrors'
          git pull --rebase origin main
          git push origin HEAD:main
      - run: python3 qvk/mirror_catalog.py --purge
