name: Build VTosters Lite auth patch

on:
  push:
    branches: ['build-vtosters-auth-20261021']
    paths:
      - '.github/workflows/vtosters-lite-build.yml'
      - 'ci/vtosters-lite-auth.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vtosters-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout build patch
        uses: actions/checkout@v4
        with:
          path: build-input
          persist-credentials: false
          sparse-checkout: ci

      - name: Checkout VTosters Lite
        uses: actions/checkout@v4
        with:
          repository: vtosters/lite
          ref: 7dd646e72be1b344617a41dd7e2c75e72b2b9440
          path: source
          persist-credentials: false

      - name: Apply authentication patch
        working-directory: source
        run: |
          git apply --check ../build-input/ci/vtosters-lite-auth.patch
          git apply ../build-input/ci/vtosters-lite-auth.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-32' 'build-tools;32.0.0' 'ndk;25.2.9519653'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/32.0.0" >> "$GITHUB_PATH"
          rustup target add armv7-linux-androideabi aarch64-linux-android

      - name: Run captcha regression checks
        working-directory: source
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/robolectric/android-all/12.1-robolectric-8229987/android-all-12.1-robolectric-8229987.jar \
            --output "$RUNNER_TEMP/android-all.jar"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-32/android.jar" \
          ANDROID_ALL_JAR="$RUNNER_TEMP/android-all.jar" bash scripts/test_auth.sh

      - name: Build complete signed APK
        working-directory: source
        run: |
          chmod +x gradlew scripts/build.sh scripts/apksigner
          ./gradlew buildVTLDev --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --stacktrace
          java -jar scripts/apksigner.jar verify --verbose scripts/VTLite.apk
          sha256sum scripts/VTLite.apk > scripts/VTLite.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VTLite-auth-captcha
          path: |
            source/scripts/VTLite.apk
            source/scripts/VTLite.apk.sha256
          if-no-files-found: error
          retention-days: 14
